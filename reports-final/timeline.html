<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Intelligence Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a202c;
            margin-bottom: 10px;
        }

        .meta {
            color: #718096;
            margin-bottom: 40px;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
        }

        .event {
            position: relative;
            margin-bottom: 30px;
        }

        .event::before {
            content: '';
            position: absolute;
            left: -33px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            border: 3px solid #4299e1;
        }

        .event.milestone::before { border-color: #9f7aea; }
        .event.insight::before { border-color: #ed8936; }
        .event.action::before { border-color: #48bb78; }

        .event-date {
            color: #718096;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .event-title {
            color: #1a202c;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .event-description {
            color: #4a5568;
            line-height: 1.6;
        }

        .event-meta {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge.critical { background: #fed7d7; color: #c53030; }
        .badge.high { background: #feebc8; color: #c05621; }
        .badge.medium { background: #e6fffa; color: #285e61; }
        .badge.low { background: #e6fffa; color: #2c7a7b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Business Intelligence Timeline</h1>
        <p class="meta">
            Generated: 1/20/2026, 7:35:22 AM<br>
            Period: 1/20/2026 - 1/20/2026<br>
            Events: 1
        </p>

        <div class="timeline">
            
                <div class="event milestone">
                    <div class="event-date">1/20/2026</div>
                    <div class="event-title">Peak in MTD Revenue</div>
                    <div class="event-description">MTD Revenue reached 583826 in 2026-01</div>
                    <div class="event-meta">
                        <span class="badge">milestone</span>
                        
                    </div>
                </div>
            
        </div>
    </div>
</body>
</html>
